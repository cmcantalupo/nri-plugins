# otel-collector-resctrl: the OTLP sink for nri-resctrl-mon.
#
# nri-resctrl-mon pushes per-pod AET counters (perf.core.energy, perf.activity,
# ...) over OTLP/gRPC to this collector. The k8sattributes processor resolves
# k8s.pod.uid -> namespace/pod/node identity, then the Prometheus exporter
# renders them on :8889 using Prometheus underscore names (e.g.
# perf_core_energy_joules_total), matching the plugin's Grafana dashboards,
# where the annotation-based `kubernetes-pods` job scrapes them.
#
# Deployed as a single replica fronted by a ClusterIP Service so the plugin has
# a stable OTLP endpoint (otel-collector-resctrl.monitoring.svc:4317) and every
# series has exactly one exporter (no cross-collector flapping).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-resctrl
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-resctrl
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-resctrl
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-resctrl
subjects:
  - kind: ServiceAccount
    name: otel-collector-resctrl
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-resctrl-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      batch:
        timeout: 10s
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
        # Normalize BOTH OTLP metric names and attribute labels to match the
        # upstream dashboards: perf_core_energy_joules_total, k8s_pod_uid,
        # resctrl_group_source. Keeping dots yields healthy scrapes but empty
        # dashboard queries and Pod-identity joins.
        translation_strategy: UnderscoreEscapingWithSuffixes
        resource_to_telemetry_conversion:
          enabled: true
    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [k8sattributes, batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-resctrl
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector-resctrl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector-resctrl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector-resctrl
    spec:
      serviceAccountName: otel-collector-resctrl
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.158.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: prom-export
              containerPort: 8889
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-resctrl-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-resctrl
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector-resctrl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: otel-collector-resctrl
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
