# Grafana: dashboards for the AET telemetry stack. Pre-provisioned with the
# in-cluster Prometheus as its default datasource and two ready-made dashboards
# (Kubernetes Pod Energy, Kubernetes Pod Perf Counters). Reachable on NodePort
# 30030. Anonymous access is disabled; the admin credentials come from the
# grafana-admin Secret, which 40-deploy-telemetry.sh creates (never committed).
# This matters because 70-grafana-tunnel.sh can publish this Grafana over HTTPS.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        editable: true
---
# The two dashboard ConfigMaps (grafana-dashboard-pod-energy and
# grafana-dashboard-pod-perf) are NOT defined here. cluster/40-deploy-telemetry.sh
# creates them from the dashboards published with the resctrl-mon plugin itself
# (deployment/helm/resctrl-mon/optional/grafana-resctrl-*.json on
# NRI_REPO@NRI_BRANCH), so the demo shows the plugin's own dashboards rather than
# a copy that drifts from it.
---
# Dashboard provider: tells Grafana to load every dashboard JSON found under
# /var/lib/grafana/dashboards (populated from the ConfigMaps below).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: aet
        orgId: 1
        folder: AET
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      securityContext:
        runAsUser: 472
        runAsNonRoot: true
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            # Credentials come from the grafana-admin Secret (created by
            # 40-deploy-telemetry.sh), never a manifest literal.
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            # Anonymous access stays off by design: this Grafana may be published
            # to the internet via 70-grafana-tunnel.sh.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Public URL Grafana is reached at. When published over HTTPS via
            # 70-grafana-tunnel.sh this MUST match the browser origin: Grafana
            # checks the request Origin against root_url when rotating the auth
            # token (every ~10 min). A mismatch fails that CSRF check, the session
            # silently drops, and every dashboard panel then shows "No data".
            # Templated by 40-deploy-telemetry.sh from GRAFANA_ROOT_URL (or, when
            # unset, https://PUBLISH_HOST:GRAFANA_HTTPS_PORT/); falls back to
            # http://localhost:3000/ for direct NodePort access. This value is
            # substituted by envsubst at apply time — a raw `kubectl apply` of
            # this file would set the literal placeholder, so deploy via the
            # script.
            - name: GF_SERVER_ROOT_URL
              value: "${GRAFANA_ROOT_URL}"
          ports:
            - name: web
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-pod-energy
              mountPath: /var/lib/grafana/dashboards/pod-energy.json
              subPath: pod-energy.json
            - name: dashboard-pod-perf
              mountPath: /var/lib/grafana/dashboards/pod-perf.json
              subPath: pod-perf.json
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-pod-energy
          configMap:
            name: grafana-dashboard-pod-energy
        - name: dashboard-pod-perf
          configMap:
            name: grafana-dashboard-pod-perf
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30030
